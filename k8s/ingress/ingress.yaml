apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  labels:
    app: microservices
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /submit
            pathType: Prefix
            backend:
              service:
                name: service-a
                port:
                  number: 80
          - path: /status
            pathType: Prefix
            backend:
              service:
                name: service-a
                port:
                  number: 80
          - path: /stats
            pathType: Prefix
            backend:
              service:
                name: service-c
                port:
                  number: 3000